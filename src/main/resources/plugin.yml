name: MinecraftRaccoon
version: 1.0.0
main: com.raccoon.RaccoonPlugin
api-version: '1.20'
author: Junie
description: A super legit Minecraft raccoon animal plugin that hatches from eggs, grows up, hunts animals, and loves humans!

commands:
  raccoon:
    description: Main command for managing raccoons and raccoon eggs
    permission: raccoon.admin
    aliases: [rc, raccoons]

permissions:
  raccoon.admin:
    description: Allows administrative access to spawn, list, give eggs, and reload config.
    default: op
  raccoon.use:
    description: Allows using raccoon eggs and interacting with raccoons.
    default: true
